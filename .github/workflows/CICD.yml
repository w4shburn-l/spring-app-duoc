# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Spring Boot App CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 
      with:
        fetch-depth: 0  
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Compilar y ejecutar pruebas unitarias
      run: mvn test

    - name: Análisis de código con SonarCloud y validación de Quality Gate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=w4shburn-l_spring-app-duoc -Dsonar.organization=w4shburn-l -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=true
      
    - name: Empaquetar la aplicación
      run: mvn clean package -DskipTests
      
    - name: Construir la imagen Docker
      run: docker build -t mi-microservicio:latest .
      
   
